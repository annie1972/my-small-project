name: Monthly Sales Tax Alert

on:
  schedule:
    - cron: '17 10 1 * *'
      timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Python script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python salestaxalert.py
          
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep monthly schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/${{ github.repository }}/actions/workflows/sales-tax-cron.yml/enable"

